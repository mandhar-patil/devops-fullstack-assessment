services:
  backend:
    build: ./backend
    image: ${DOCKERHUB_USER}/devops-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
    expose:
      - "8000"
    networks:
      - devops-network

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${API_URL:-/api}
    image: ${DOCKERHUB_USER}/devops-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "80:8080"
    depends_on:
      - backend
    networks:
      - devops-network

networks:
  devops-network:
    name: devops-network
    driver: bridge
